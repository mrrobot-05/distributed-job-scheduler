[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"distributed_job_scheduler/settings/__init__.py" = ["E402"]
"distributed_job_scheduler/settings/local.py" = ["F403", "F405"]
"distributed_job_scheduler/settings/production.py" = ["F403", "F405"]
"scheduler/migrations/*" = ["E501"]
"verify_all.py" = ["E402", "E501", "F401"]

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "distributed_job_scheduler.settings.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "scheduler.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "distributed_job_scheduler.settings.local"
