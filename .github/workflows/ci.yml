name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_scheduler

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_scheduler
        ports: 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          python manage.py migrate --noinput
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run linting (ruff)
        run: |
          pip install ruff
          ruff check .

      - name: Run type checking (mypy)
        run: |
          pip install mypy django-stubs
          mypy scheduler/ --ignore-missing-imports || true

      - name: Run tests
        run: |
          python manage.py test scheduler --verbosity=2
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Check for security issues
        run: |
          pip install bandit
          bandit -r scheduler/ -f json -o bandit-report.json || true

      - name: Upload coverage (if available)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            bandit-report.json

  build-and-deploy:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t distributed-job-scheduler:${{ github.sha }} .

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker tag distributed-job-scheduler:${{ github.sha }} ghcr.io/${{ github.repository }}/distributed-job-scheduler:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/distributed-job-scheduler:${{ github.sha }}

      - name: Deploy to staging (example)
        run: |
          echo "Deploy to staging environment"
          # Add your deployment commands here
          # e.g., kubectl apply, railway deploy, render deploy, etc.