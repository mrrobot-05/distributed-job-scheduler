name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  DJANGO_SETTINGS_MODULE: 'distributed_job_scheduler.settings.local'
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_scheduler

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_scheduler
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-ci.txt

      - name: Run Django system checks
        run: |
          python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: ${{ env.DJANGO_SETTINGS_MODULE }}
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run migrations
        run: |
          python manage.py migrate --noinput
        env:
          DJANGO_SETTINGS_MODULE: ${{ env.DJANGO_SETTINGS_MODULE }}
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Check for missing migrations
        run: |
          python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: ${{ env.DJANGO_SETTINGS_MODULE }}
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run linting (ruff)
        run: |
          ruff check .

      - name: Run type checking (mypy)
        run: |
          mypy scheduler/ --ignore-missing-imports

      - name: Run tests
        run: |
          python manage.py test scheduler --verbosity=2
        env:
          DJANGO_SETTINGS_MODULE: ${{ env.DJANGO_SETTINGS_MODULE }}
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Check for security issues (bandit)
        run: |
          bandit -r scheduler/ -f json -o bandit-report.json

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: bandit-report.json


